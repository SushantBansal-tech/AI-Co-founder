  <!-- Services and data -->
  <text class="section" x="70" y="1190">4 · SERVICES, MEMORY AND DURABLE EXECUTION</text>
  <rect class="boundary" x="70" y="1210" width="2260" height="190"/>

  <rect class="data" x="110" y="1230" width="730" height="125"/>
