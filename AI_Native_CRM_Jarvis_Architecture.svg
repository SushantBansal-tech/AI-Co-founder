  <text class="body" x="140" y="1300">catalog · inventory · capacity · delivery · prices · costs</text>
  <text class="body" x="140" y="1328">transport · discount bands · margin rules · GST · payment terms</text>

  <rect class="data" x="930" y="1230" width="410" height="125"/>
  <text class="h2" x="960" y="1268">Qdrant semantic memory</text>
  <text class="body" x="960" y="1300">documents · notes · narrative policy</text>
  <text class="body" x="960" y="1328">technical search · customer context</text>

  <rect class="provider" x="1435" y="1230" width="320" height="125"/>
  <text class="h2" x="1465" y="1268">Durable workers</text>
  <text class="body" x="1465" y="1300">follow-up · inbound email</text>
  <text class="body" x="1465" y="1328">memory outbox · retries</text>

  <rect class="data" x="1850" y="1230" width="400" height="125"/>
  <text class="h2" x="1880" y="1268">LangGraph checkpoints</text>
  <text class="body" x="1880" y="1300">PostgreSQL-backed workflow state</text>
  <text class="body" x="1880" y="1328">same thread resumes after restart</text>

  <!-- Source of truth -->
  <text class="section" x="70" y="1440">5 · SYSTEM OF RECORD AND AUDIT</text>
  <rect class="data" x="70" y="1460" width="1310" height="240"/>
  <text class="h2" x="105" y="1505">PostgreSQL · single source of truth</text>
  <text class="body" x="105" y="1542">customers · customer identities · leads · assignments · interactions · tasks</text>
  <text class="body" x="105" y="1573">quotations and versions · negotiations · purchase orders · sales orders · payments</text>
  <text class="body" x="105" y="1604">pipeline instances · follow-up jobs · channel jobs · processed events</text>
  <text class="body" x="105" y="1635">AI service principals · authority policies · AI action requests · approval decisions</text>
  <text class="small" x="105" y="1672">Exact business facts live here. Qdrant and checkpoints support the system but do not replace the CRM record.</text>

  <rect class="audit" x="1750" y="1460" width="580" height="240"/>
  <text class="h2" x="1785" y="1505">Append-only business events</text>
  <text class="body" x="1785" y="1542">AI action proposed</text>
