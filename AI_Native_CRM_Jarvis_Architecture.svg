<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 2400 1800" role="img" aria-labelledby="title desc">
  <title id="title">AI-Native Sales OS, CRM and Jarvis architecture</title>
  <desc id="desc">Updated architecture showing customer channels, channel ingestion, permanent customer identity, persistent LangGraph sales workflow, structured PostgreSQL repositories, Qdrant memory, Jarvis orchestration, controlled business tools, authority policies, approval gates, founder command centre, idempotent action execution and complete auditing.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6d4aff"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b7791f"/>
    </marker>
    <style>
      .canvas { fill:#f7f8fb; }
      .title { font:700 42px "Segoe UI",Arial,sans-serif; fill:#17212b; }
      .subtitle { font:400 21px "Segoe UI",Arial,sans-serif; fill:#52606d; }
      .section { font:700 20px "Segoe UI",Arial,sans-serif; letter-spacing:1px; fill:#334e68; }
