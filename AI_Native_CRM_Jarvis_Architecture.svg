      .label { font:650 14px "Segoe UI",Arial,sans-serif; fill:#334e68; }
      .new-label { font:700 12px "Segoe UI",Arial,sans-serif; letter-spacing:.8px; fill:#ffffff; }
      .boundary { fill:#ffffff; stroke:#d8dee8; stroke-width:2; rx:22; }
      .channel { fill:#eaf4ff; stroke:#72a7d8; stroke-width:2; rx:16; }
      .crm { fill:#f0edff; stroke:#8b78e6; stroke-width:2; rx:16; }
      .policy { fill:#fff5df; stroke:#d7a54b; stroke-width:2; rx:16; }
      .workflow { fill:#eaf8f1; stroke:#5ea782; stroke-width:2; rx:16; }
      .data { fill:#eef2f6; stroke:#93a1b1; stroke-width:2; rx:16; }
      .audit { fill:#fff0ef; stroke:#d17870; stroke-width:2; rx:16; }
      .provider { fill:#f4f6f8; stroke:#aab4c0; stroke-width:2; rx:16; }
      .connector { fill:none; stroke:#52606d; stroke-width:3; marker-end:url(#arrow); }
      .connector-purple { fill:none; stroke:#6d4aff; stroke-width:3.5; marker-end:url(#arrow-purple); }
      .connector-amber { fill:none; stroke:#b7791f; stroke-width:3.5; marker-end:url(#arrow-amber); }
      .connector-dashed { fill:none; stroke:#73808c; stroke-width:2.5; stroke-dasharray:10 8; marker-end:url(#arrow); }
      .bus { fill:none; stroke:#93a1b1; stroke-width:3; }
    </style>
