services:
  postgres:
    image: postgres:17
    container_name: ai-sales-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sales_os
      POSTGRES_USER: sales_user
      POSTGRES_PASSWORD: 12345678

    ports:
      - "5433:5432"

    volumes:
      - ai_sales_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sales_user -d sales_os"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_sales_postgres_data: